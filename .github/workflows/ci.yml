name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  agent:
    runs-on: ubuntu-latest
    env:
      USE_MOCK: '1'
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: python -m pip install -r requirements.txt
      - run: python -m ruff check .
      - run: python -m compileall -q badaro
      - run: python ../scripts/check_design.py
      - run: python -m pytest
