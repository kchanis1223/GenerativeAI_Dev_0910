[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "badaro-agent"
version = "0.1.0"
description = "Badaro dispatch assistance agent"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "pydantic>=2,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["badaro*", "prompts*"]

[tool.setuptools.package-data]
prompts = ["*.md"]
"badaro.tools" = ["mock_responses/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
