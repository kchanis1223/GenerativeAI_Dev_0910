name: Sample data compatibility
on:
  pull_request:
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
        working-directory: agent
      - run: python data/validate_samples.py
        working-directory: agent
      - run: python -m pytest tests/test_sample_data.py
        working-directory: agent
        env:
          USE_MOCK: '1'
